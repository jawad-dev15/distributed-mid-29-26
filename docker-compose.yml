services:
  # Metadata & Registry Service
  metadata_service:
    build:
      context: .
      dockerfile: metadata_service/Dockerfile
    container_name: metadata_service
    ports:
      - "8000:8000"
    volumes:
      - ./data/metadata:/app/data
    restart: unless-stopped

  # Storage Node 1
  storage_node_1:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    container_name: storage_node_1
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=storage_node_1
      - PORT=8001
      - STORAGE_DIR=/data/chunks
      - METADATA_URL=http://metadata_service:8000/api/heartbeat
      - HEARTBEAT_INTERVAL=5
    volumes:
      - ./data/node_1:/data
    depends_on:
      - metadata_service
    restart: unless-stopped

  # Storage Node 2
  storage_node_2:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    container_name: storage_node_2
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=storage_node_2
      - PORT=8002
      - STORAGE_DIR=/data/chunks
      - METADATA_URL=http://metadata_service:8000/api/heartbeat
      - HEARTBEAT_INTERVAL=5
    volumes:
      - ./data/node_2:/data
    depends_on:
      - metadata_service
    restart: unless-stopped

  # Storage Node 3
  storage_node_3:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    container_name: storage_node_3
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=storage_node_3
      - PORT=8003
      - STORAGE_DIR=/data/chunks
      - METADATA_URL=http://metadata_service:8000/api/heartbeat
      - HEARTBEAT_INTERVAL=5
    volumes:
      - ./data/node_3:/data
    depends_on:
      - metadata_service
    restart: unless-stopped

  # Storage Node 4
  storage_node_4:
    build:
      context: .
      dockerfile: storage_node/Dockerfile
    container_name: storage_node_4
    ports:
      - "8004:8004"
    environment:
      - NODE_ID=storage_node_4
      - PORT=8004
      - STORAGE_DIR=/data/chunks
      - METADATA_URL=http://metadata_service:8000/api/heartbeat
      - HEARTBEAT_INTERVAL=5
    volumes:
      - ./data/node_4:/data
    depends_on:
      - metadata_service
    restart: unless-stopped

  # RabbitMQ Broker for Asynchronous Repair & Rebalance
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  # Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
