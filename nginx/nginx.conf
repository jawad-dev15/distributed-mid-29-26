events {
    worker_connections 1024;
}

http {
    upstream storage_gateways {
        least_conn;
        server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8081 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8088;
        server_name localhost;

        location / {
            proxy_pass http://storage_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /health {
            return 200 '{"status": "UP", "load_balancer": "nginx", "upstreams": ["gateway_1:8080", "gateway_2:8081"]}';
            add_header Content-Type application/json;
        }
    }
}
